name: Build Google Pixel 3a sargo (LineageOS 20) KSU-Next + SUSFS 2.2.0 (Kernel 4.9)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "google_sargo"
  DEVICE_CODENAME : "sargo"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1"

  # Kernel LineageOS 20 (4.9.x) — community-patched, SUSFS áp sạch hơn Google Stock.
  KERNEL_SOURCE : "https://github.com/LineageOS/android_kernel_google_msm-4.9.git"
  KERNEL_BRANCH : "lineage-20"

  # proton-clang: hợp kernel 4.x cũ hơn clang mới
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "bonito_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "next"   # KSU-Next: manager release dong bo, test detection tren Google Stock

  SUSFS_ENABLE : true   # bat susfs tren LineageOS kernel
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/Oneloutre/AnyKernel3.git"
  AK3_BRANCH : "b4s4"

  BOOT_SOURCE : ""

  NEED_DTBO : true
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineage20_4.9"

  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "true"

  KERNELSU_METHOD: "shell"   # shell boot an toàn (manual nghi bootloop); giữ PACK_KMODULES cho wifi

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "true"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "true"   # giu revert 5 file reject (nếu false -> patch susfs dừng)

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Google Pixel 3a sargo (LineageOS 20) (Kernel 4.9)
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🩹 KSU-Next 4.9 compat (security_context_to_sid 5-arg)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          SH="drivers/kernelsu/feature/selinux_hide.c"
          if [ -f "$SH" ] && ! grep -q 'selinux_state,' "$SH"; then
            sed -i 's/security_context_to_sid("u:r:/security_context_to_sid(\&selinux_state, "u:r:/g' "$SH"
            echo "[+] patched security_context_to_sid in selinux_hide.c"
            grep -n 'security_context_to_sid' "$SH" | head
          fi

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🧩 Backport 4.9 cho SukiSU (fallthrough / strncpy_from_user_nofault / set_memory.h)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # 1. fallthrough (macro có từ ~5.4, 4.9 chưa có)
          if ! grep -rq 'define fallthrough' include/linux/compiler.h include/linux/compiler_types.h 2>/dev/null; then
            printf '\n#ifndef fallthrough\n#define fallthrough do {} while (0)\n#endif\n' >> include/linux/compiler.h
            echo "[+] added fallthrough"
          fi
          # 2. linux/set_memory.h (4.9 để set_memory_* trong asm/cacheflush.h)
          if [ ! -f include/linux/set_memory.h ]; then
            printf '#ifndef _LINUX_SET_MEMORY_H\n#define _LINUX_SET_MEMORY_H\n#include <asm/cacheflush.h>\n#endif\n' > include/linux/set_memory.h
            echo "[+] created linux/set_memory.h"
          fi
          # 3. strncpy_from_user_nofault (5.8+) shim vào cuối linux/uaccess.h (base64 tránh lỗi YAML heredoc)
          if ! grep -rq 'strncpy_from_user_nofault' include/linux/uaccess.h; then
            echo '' | base64 -d >> include/linux/uaccess.h
            echo "[+] added strncpy_from_user_nofault shim"
          fi
          # 4. SukiSU builtin BUG non-GKI: ksu.c chỉ #include feature/selinux_hide.c khi >=5.10,
          #    nhưng runtime/ksud.c gọi ksu_selinux_hide_* vô điều kiện -> undefined khi link trên 4.9.
          #    Fix: prepend stub rỗng vào ksud.c (feature selinux_hide tắt trên 4.9; susfs lo phần chính).
          KSUD="drivers/kernelsu/runtime/ksud.c"
          if [ -f "$KSUD" ] && ! grep -qF 'COMPAT_SELINUX_HIDE_STUB' "$KSUD"; then
            echo '' | base64 -d > /tmp/ksud.new
            cat "$KSUD" >> /tmp/ksud.new
            cp /tmp/ksud.new "$KSUD"
            echo "[+] prepended selinux_hide stubs to ksud.c"
          else
            echo "[i] ksud.c: -f=$([ -f "$KSUD" ] && echo yes || echo no)"
          fi

      - name: 🩹 KSU-Next compat symbols cho susfs inline-hook (init_rc_hook + sys_read)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # susfs_inline_hook_patches.sh chèn vào fs/read_write.c (dưới #ifdef CONFIG_KSU):
          #   extern struct static_key_true ksu_is_init_rc_hook_enabled;
          #   extern int ksu_handle_sys_read(unsigned int fd);
          #   if (static_branch_unlikely(&ksu_is_init_rc_hook_enabled)) ksu_handle_sys_read(fd);
          # Đây là symbol của SukiSU/ReSukiSU; KSU-Next legacy KHÔNG có -> undefined ở link.
          # Fix: định nghĩa vào cuối fs/read_write.c (đã compiled + đã có extern, khớp type).
          # static_key init FALSE (disabled) -> nhánh KHÔNG bao giờ chạy -> ksu_handle_sys_read no-op.
          RW="fs/read_write.c"
          if [ -f "$RW" ] && grep -q 'ksu_is_init_rc_hook_enabled' "$RW" && ! grep -qF 'KSU_NEXT_INITRC_COMPAT' "$RW"; then
            # base64: định nghĩa C (tránh lỗi YAML với ký tự đặc biệt)
            echo '' | base64 -d >> "$RW"
            echo "[+] Added KSU_NEXT_INITRC_COMPAT symbols to fs/read_write.c"
            tail -5 "$RW"
          else
            echo "[i] read_write.c: skip (present=$(grep -c ksu_is_init_rc_hook_enabled "$RW" 2>/dev/null), compat=$(grep -c KSU_NEXT_INITRC_COMPAT "$RW" 2>/dev/null))"
          fi

      - name: 🪛 Extra Kernel Options (bonito 4.9)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          D="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          # Tắt vdso32 (LLVM IAS không assemble được asm ARM32 -> build fail). App 32-bit vẫn chạy.
          echo "CONFIG_COMPAT_VDSO=n" >> "$D"
          echo "CONFIG_LTO_NONE=y"     >> "$D"
          echo "CONFIG_LTO_CLANG=n"    >> "$D"
          echo "CONFIG_SHADOW_CALL_STACK=n" >> "$D"
          echo "CONFIG_CFI_CLANG=n"    >> "$D"
          # Tắt auto-version (git hash + dirty) -> chuỗi uts không vượt 64 ký tự. susfs SPOOF_UNAME giả version stock trên máy.
          sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$D"
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> "$D"
          sed -i '/^CONFIG_LOCALVERSION=/d' "$D"
          echo 'CONFIG_LOCALVERSION=""' >> "$D"

      - name: 🩹 Core-susfs revert 5 file phụ reject (API cũ) va tat sub-feature
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          D="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          # Trả 5 file bị reject về nguyên bản Google (bỏ trạng thái partial gây lỗi cú pháp)
          git checkout -- fs/proc/cmdline.c fs/stat.c fs/notify/fdinfo.c security/selinux/avc.c fs/proc/task_mmu.c 2>/dev/null || true
          find . -name '*.rej' -delete 2>/dev/null || true
          find . -name '*.orig' -delete 2>/dev/null || true
          # Tắt các sub-feature dùng API cũ (giữ lõi SUS_PATH + SUS_MOUNT + TRY_UMOUNT + SPOOF_UNAME)
          for k in CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_SUS_KSTAT \
                   CONFIG_KSU_SUSFS_SUS_MAP CONFIG_KSU_SUSFS_OPEN_REDIRECT; do
            sed -i "/^$k=/d" "$D"
            echo "# $k is not set" >> "$D"
          done
          echo "[+] Core susfs 2.2.0: giữ SUS_PATH/SUS_MOUNT/TRY_UMOUNT/SPOOF_UNAME; tắt kstat/map/open_redirect/cmdline-spoof."

      - name: 🛠 Cài mkdtimg (bonito build dtbo.img cần)
        run: |
          chmod +x "$GITHUB_WORKSPACE/tools/mkdtimg"
          sudo cp "$GITHUB_WORKSPACE/tools/mkdtimg" /usr/local/bin/mkdtimg
          file /usr/local/bin/mkdtimg || true
          echo "mkdtimg: $(command -v mkdtimg)"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
